name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      can_push: ${{ steps.check-secrets.outputs.can_push }}
      can_deploy: ${{ steps.check-secrets.outputs.can_deploy }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Check required secrets
        id: check-secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets are missing, so the workflow will run build-only validation."
          fi

          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ] && [ -n "$EC2_HOST" ] && [ -n "$EC2_USERNAME" ] && [ -n "$EC2_SSH_KEY" ] && [ -n "$MONGODB_URI" ] && [ -n "$JWT_SECRET" ] && [ -n "$CLOUDINARY_CLOUD_NAME" ] && [ -n "$CLOUDINARY_API_KEY" ] && [ -n "$CLOUDINARY_API_SECRET" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are incomplete, so the deploy job will be skipped."
          fi

      - name: Set image tags
        id: image-tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "backend_tag=$DOCKER_USERNAME/food-backend:latest" >> "$GITHUB_OUTPUT"
            echo "frontend_tag=$DOCKER_USERNAME/food-frontend:latest" >> "$GITHUB_OUTPUT"
          else
            echo "backend_tag=food-backend:ci" >> "$GITHUB_OUTPUT"
            echo "frontend_tag=food-frontend:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.can_push == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: ${{ steps.check-secrets.outputs.can_push == 'true' }}
          load: ${{ steps.check-secrets.outputs.can_push != 'true' }}
          tags: ${{ steps.image-tags.outputs.backend_tag }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: ${{ steps.check-secrets.outputs.can_push == 'true' }}
          load: ${{ steps.check-secrets.outputs.can_push != 'true' }}
          tags: ${{ steps.image-tags.outputs.frontend_tag }}
          build-args: |
            VITE_API_URL=/api

  deploy:
    needs: build-and-push
    if: needs.build-and-push.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/food
            cd ~/food

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose is not installed on the server."
              exit 1
            fi

            cat <<EOF > .env
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EOF

            cat <<'EOF' > docker-compose.yml
            services:
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/food-backend:latest
                container_name: food_backend
                environment:
                  - PORT=5000
                  - MONGODB_URI=${MONGODB_URI}
                  - JWT_SECRET=${JWT_SECRET}
                  - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
                  - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
                  - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
                restart: always

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/food-frontend:latest
                container_name: food_frontend
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: always
            EOF

            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d --remove-orphans
