name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/food-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/food-frontend:latest
          build-args: |
            VITE_API_URL=/api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/food
            cd ~/food

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose is not installed on the server."
              exit 1
            fi

            cat <<EOF > .env
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EOF

            cat <<'EOF' > docker-compose.yml
            services:
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/food-backend:latest
                container_name: food_backend
                environment:
                  - PORT=5000
                  - MONGODB_URI=${MONGODB_URI}
                  - JWT_SECRET=${JWT_SECRET}
                  - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
                  - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
                  - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
                restart: always

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/food-frontend:latest
                container_name: food_frontend
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: always
            EOF

            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d --remove-orphans
