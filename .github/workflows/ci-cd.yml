name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/food-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/food-frontend:latest
          build-args: |
            VITE_API_URL=/api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the project directory or create it if it doesn't exist
            mkdir -p ~/food
            cd ~/food
            
            # Fetch the latest docker-compose.yml (or pull from git if the repo is cloned)
            # Assuming you have cloned the repo on EC2 or you upload docker-compose.yml
            # If using generic images from Docker Hub, we can create a production docker-compose.yml here
            
            cat << 'EOF' > docker-compose.yml
            services:
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/food-backend:latest
                container_name: food_backend
                environment:
                  - PORT=5000
                  - MONGODB_URI=${MONGODB_URI}
                  - JWT_SECRET=${JWT_SECRET}
                  - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
                  - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
                  - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
                restart: always

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/food-frontend:latest
                container_name: food_frontend
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: always
            EOF
            
            # Pull latest images
            docker-compose pull
            
            # Restart containers
            docker-compose up -d
